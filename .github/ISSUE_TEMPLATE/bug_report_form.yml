name: Bug Report
description: Report an application bug
title: "[BUG]: "
labels: ["bug"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  # - type: input
  #   id: contact
  #   attributes:
  #     label: Contact Details
  #     description: How can we get in touch with you if we need more info?
  #     placeholder: ex. email@example.com
  #   validations:
  #     required: false

  - type: textarea
    id: issue-description
    attributes:
      label: Describe the issue
      description: Please describe the bug that you encountered. 
      placeholder: General bug information
      value: "A bug happened!"
    validations:
      required: true

  # - type: dropdown
  #   id: version
  #   attributes:
  #     label: Version
  #     description: What version of our software are you running?
  #     options:
  #       - 1.0.2 (Default)
  #       - 1.0.3 (Edge)
  #     default: 0
  #   validations:
  #     required: true
  # - type: dropdown
  #   id: browsers
  #   attributes:
  #     label: What browsers are you seeing the problem on?
  #     multiple: true
  #     options:
  #       - Firefox
  #       - Chrome
  #       - Safari
  #       - Microsoft Edge

  - type: textarea
    id: logs
    attributes:
      label: Relevant replicability 
      description: Please describe how to replicate the bug. (if applicable)
    validations:
      required: false
      # render: shell

  # - type: checkboxes
  #   id: terms
  #   attributes:
  #     label: Code of Conduct
