name: Run Selenium Tests
run-name: ${{ github.workflow }} - ${{ github.ref }} - by ${{ github.actor }}

# events that trigger this workflow
on:
  pull_request:
    branches: [ "main", "prod" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      browser:
        type: choice
        description: Which browser to test
        required: true
        options:
          - chrome
          - firefox
          - edge
        default: firefox

# jobs to be executed on runner machines
jobs:
  selenium-tests: 
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up .env file
        working-directory: ./docker
        run: |
          cp ./env.demo ./.env
          echo "SELENIUM_BROWSER=${{ inputs.browser }}" >> ./.env

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies

      - name: Install testing dependencies
        run: |
          pip install --root-user-action=ignore -r src/test/requirements.txt > /dev/null

      - name: run docker compose to start the application 
        working-directory: ./docker
        run: |
          docker compose --profile testing up --build -d

      - name: Wait for services to be ready 
        run: |
          # Wait for the containers to be ready
          sleep 20
        
      - name: Run Selenium tests
        run: |
          # Run your Selenium tests here, for example:
          pytest src/test/

  