name: CI (Tests)
run-name: ${{ github.workflow }} - ${{ github.ref }} - by ${{ github.actor }}

# events that trigger this workflow
on:
  pull_request:
    branches: [ "main", "prod" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.gitignore'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/zap_security.yml'
  workflow_dispatch:
    inputs:
      browser:
        type: choice
        description: Which browser to test
        required: true
        options:
          - chrome
          - firefox
          - edge
        default: firefox

# jobs to be executed on runner machines
jobs:

  # we can split this out if we find a way to make test configs 
  # to NOT need the mysql container to be setup...
  
  # php-tests:
  #   name: PestPHP tests + Composer migrations
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v6

  #     - name: Set up .env file
  #       working-directory: ./docker
  #       run: |
  #         cp ./demo.env ./.env
  #         echo -e "\nSELENIUM_BROWSER=${{ inputs.browser }}" >> ./.env

  #     - name: run docker compose to start the application 
  #       working-directory: ./docker
  #       run: |
  #         docker compose --profile testing up --build -d

  #     - name: Setup PHP with PECL extension
  #       uses: shivammathur/setup-php@v2
  #       with:
  #         php-version: '8.3'
  #         extensions: xml, mysql, cli

  #     - name: Install composer dependencies
  #       working-directory: ./src/abet_private
  #       run: |
  #         composer install --no-interaction --prefer-dist --optimize-autoloader 

  selenium-tests: 
    name: Test General Functionality
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     browser: [chrome]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up .env file
        working-directory: ./docker
        run: |
          cp ./demo.env ./.env
          echo -e "\nSELENIUM_BROWSER=${{ inputs.browser || 'firefox' }}" >> ./.env
          echo -e "\nUID=$(id -u)" >> ./.env

      - name: run docker compose to start the application 
        working-directory: ./docker
        run: |
          docker compose --profile testing up --build -d

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: xml, mysql, cli, redis

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies

      - name: Install testing dependencies
        run: |
          pip install --root-user-action=ignore -r src/test/requirements.txt > /dev/null

      # ci debug

      # - name: Wait for services to be ready 
      #   run: |
      #     # Wait for the containers to be ready
      #     sleep 10

      - name: Fetch URL with wget
        run: |
          URL="http://localhost:8080/login"
          OUTPUT="response.html"

          wget \
            -S \
            --max-redirect=20 \
            --output-document="$OUTPUT" \
            "$URL" | true
      
      - name: Fetch URL with curl
        run: curl -v http://localhost:8080/ || true

      - name: dump docker logs
        run: docker logs php_apache

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fetched-response
          path: response.html

      - name: Run migrations
        working-directory: ./src/abet_private
        run: |
          docker exec -i --env-file ../../docker/.env --env APP_ENV=test php_apache \
            sh -c 'cd "$ABET_PRIVATE_DIR" && ./bin/console doctrine:migrations:migrate --no-interaction'

      - name: Run Selenium tests
        env:
          # Selenium's browser runs inside the selenium container, on the
          # same Docker network as php_apache, so WEBSERVER_HOSTNAME
          # (default 'php_apache') resolves fine there. pytest itself runs
          # natively on this runner though, outside that network — its own
          # direct HTTP calls (see src/test/utils/backend_login.py) need
          # the host-mapped port instead.
          BACKEND_URL: http://localhost:8080
        run: |
          # Run your Selenium tests here, for example:
          pytest src/test/

      - name: Run Pest tests
        working-directory: ./src/abet_private
        run: |
          composer test
