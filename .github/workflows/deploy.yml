name: Deploy to Production
on:
    push:
        branches: [ "prod" ]
    workflow_dispatch:
    release:
      types: [published]
jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - name: Add remote to known hosts
          run: |
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.ABET_REMOTE_HOSTNAME }} >> ~/.ssh/known_hosts

        - name: Set up SSH
          uses: webfactory/ssh-agent@v0.9.0
          with:
            ssh-private-key: '${{ secrets.ABET_PRIVATE_KEY }}'

        - name: check if rsync is installed
          run: "rsync --version || (echo 'rsync is not installed' && exit 1)"

        - name: Run Deployment Script to Remote Server
          run: ./scripts/deployment/deploy.bash -y
