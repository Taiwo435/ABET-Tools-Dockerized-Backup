name: Deploy to Production
on:
    push:
        branches: [ "prod" ]
    workflow_dispatch:
jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4
        
        - name: Set up SSH
          uses: webfactory/ssh-agent@v0.9.0
          with:
            ssh-private-key: ${{ secrets.ABET_PRIVATE_KEY }}
        
        - name: Run Deployment Script to Remote Server
          run: './scripts/deployment/deploy.bash -y'