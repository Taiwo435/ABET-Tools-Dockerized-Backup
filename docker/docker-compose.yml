services:
  ###################################################
  # the PHP/Apache container serves the web application and handles PHP processing. 
  # The container is configured with environment variables for database connection. 
  # It maps port 8080 on the host to port 80 in the container. 
  # The application code is mounted as a volume to allow for easy development and updates.
  ###################################################
  php_apache:
    build: 
      context: ../
      dockerfile: docker/app/Dockerfile
    container_name: php_apache
    hostname: ${WEBSERVER_HOSTNAME:?error}
    env_file:
      - .env
    environment:
      - SESSION_IDLE_TIMEOUT=1800
      - SESSION_ABSOLUTE_TIMEOUT=28800
      - SESSION_COOKIE_SAMESITE=Lax
    ports:
      - "${WEBSERVER_PORT:-8080}:80"
    volumes:
      - ../src/public:/var/www/html
      - ../src/abet_private:${ABET_PRIVATE_DIR:?error}
      - .:${ABET_PRIVATE_DIR:?error}/../../docker    # for the .env variable
    user: "{UID:1000}:33"
    networks:
      - app_network
    depends_on:
      - mysql

  ###################################################
  # the MySQL container provides the database service for the application.
  # It is configured with environment variables (in ./.env) for the root password, database name, user, and password.
  ###################################################
  mysql:
    build: 
      context: ./mysql/
      dockerfile: Dockerfile
    container_name: mysql
    hostname: ${MYSQL_HOSTNAME:?error}
    ports: 
      - ${MYSQL_PORT}:${MYSQL_PORT}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASS}
    volumes:
      #- ./mysql/mysql_data:/var/lib/mysql # Uncomment this line to persist MySQL data on the host machine
      - ../src/abet_private:${ABET_PRIVATE_DIR}
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  ###################################################
  # phpMyAdmin for a web-based interface for managing the MySQL database.
  ###################################################
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASS}
      PMA_PORT: ${MYSQL_PORT:-3306}
    restart: always
    ports:
      - "${PHP_MYADMIN_PORT:?error}:80"
    networks:
      - app_network
    depends_on:
      - mysql

  ###################################################
  # Assignment Extraction FastAPI Backend
  # Handles Canvas extraction and serves data for report gen
  ###################################################
  extraction_api:
    build: 
      context: ../
      dockerfile: docker/extraction_api/Dockerfile
      args:
        EXTRACTION_PORT: ${EXTRACTION_PORT:?error}
    container_name: extraction_api
    hostname: ${EXTRACTION_HOSTNAME:?error}
    env_file:
      - .env
    ports:
      - "${EXTRACTION_PORT:?error}:${EXTRACTION_PORT:?error}" 
    volumes:
      - ../src/extraction_api:/usr/src/app
      - ../src/shared:/usr/src/app/shared
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      mysql:
        condition: service_healthy

 
  ###################################################
  # Canvas Formatting FastAPI Backend
  # Generates course/ABET HTML pages and uploads to Canvas modules
  ###################################################
  canvas_formatting_api:
    build:
      context: ../
      dockerfile: docker/canvas_formatting_api/Dockerfile
      args:
        CANVAS_FORMATTING_PORT: ${CANVAS_FORMATTING_PORT:?error}
    container_name: canvas_formatting_api
    hostname: ${CANVAS_FORMATTING_HOSTNAME:?error}
    ports:
      - "${CANVAS_FORMATTING_PORT:?error}:8001"
    volumes:
      - ../src/canvas_formatting_api:/usr/src/app
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 1.1.1.1


  ###################################################
  # the report generation container that hosts the fastapi backend
  # accessed by the php_apache container to generate reports.
  # we may optinally give it environment variables for database connections if needed in the future.
  ###################################################
  reportgen:
    build: 
      context: ../
      dockerfile: docker/reportgen/Dockerfile
      args:
        REPORTGEN_PORT: ${REPORTGEN_PORT:?error}
    container_name: reportgen
    hostname: ${REPORTGEN_HOSTNAME:?error}
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    volumes:
      - ../src/report_generation_api:/usr/src/app
    ports:
      - "${REPORTGEN_PORT:?error}:${REPORTGEN_PORT:?error}"  
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1

  ###################################################
  # the selenium container for running end-to-end tests with a headless browser.
  ###################################################
  selenium:
    image: selenium/standalone-${SELENIUM_BROWSER:?error}:latest
    container_name: selenium
    hostname: ${SELENIUM_HOSTNAME:?error}
    profiles:
      - testing
    ports:
      - "${SELENIUM_PORT:?error}:4444"   
    networks:
      - app_network

  ###################################################
  # Redis - message broker + result backend for Celery
  ###################################################
  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app_network

  ###################################################
  # Celery Worker - executes background tasks from all services
  ###################################################
  celery_worker:
    build:
      context: ../
      dockerfile: docker/celery_worker/Dockerfile
    container_name: celery_worker
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../src/extraction_api:/usr/src/app/extraction_api
      - ../src/canvas_formatting_api:/usr/src/app/canvas_formatting_api
      - ../src/shared:/usr/src/app/shared
    stop_grace_period: 120s
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8

  ###################################################
  # Flower - Celery monitoring dashboard (this is optional as we can implement our own admin view, but I added it to check it out for now)
  ###################################################
  flower:
    build:
      context: ../
      dockerfile: docker/celery_worker/Dockerfile
    container_name: flower
    command: >
      celery -A shared.celery_app:celery_app flower
      --port=5555 --persistent=True --db=/data/flower.db
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    volumes:
      - flower_data:/data
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  ###################################################
  # the default network that allows the containers to communicate with each other.
  # just in case we want to change network settings in the future, we define it explicitly here.
  ###################################################

volumes:
  redis_data:
  flower_data:

networks:
  app_network:
    name: app_network
    driver: bridge
