# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html
# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@Redis'
            - { prefix: '%env(REDIS_PREFIX_SYMFONY)%' }
    Redis:
        class: \Redis
        calls:
            - connect:
                - '%env(REDIS_HOST)%'
                - '%env(int:REDIS_PORT)%'
    App\Service\Report\AppendixAReportExportBoundary:
        alias: App\Service\Report\AppendixAReportExportService
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    # LegacyBridge.php runs outside normal DI (called statically from
    # index.php's front controller), so it needs the Security service
    # made public to be fetched directly from the container. #132
    #
    # This is an alias to the bundle's existing "security.helper" service —
    # NOT a new service definition. Declaring it without `alias:` here
    # tells the container to autowire+construct Security from scratch,
    # which fails because its constructor takes an internal container
    # argument that autowiring can't resolve.
    Symfony\Bundle\SecurityBundle\Security:
        alias: security.helper
        public: true
    # Needed so index.php can render the branded error template for
    # exceptions thrown outside the normal Symfony request lifecycle
    # (e.g. from LegacyBridge's authorization checks). #51
    Twig\Environment:
        alias: twig
        public: true
    App\Repository\SyllabusReadinessRepository:
        public: true
